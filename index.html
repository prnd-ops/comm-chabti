 "레이":{n:"레이",b:"기아",pr:1150,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/24/81b341fe-abc7-44c5-a699-652d8bfc90c1.jpeg",r:"타보지않은사람만 욕함. 실내 넓고 취등록세없고 톨비반값 세금싸고 주유비환급에 연비 시내12 고속18 (구라없이ㄹㅇ) 슬라이드도어 장점이고 레저 활용도 높고 주차편하고 골목길 지나다닐때 쫄필요없고 박스카 특성상 전면유리며 창문이며 큼직큼직해서 시야가 너무 넓어서 사각지대가 아예없고 잔고장없고 엔진오일만 갈면됌. 걍 편한 신발 그 자체임.",c:"1.생각보다 주변에서 경차왜샀냐고 핀잔 많이함. 회사 지인, 가끔보는 친척어른등 이게 실제로 평이 안좋은게 단점임 열받기때문 2.출력이 확실히 모자람. 토크도 약하고 마력도 약함. 고속주행이 불가능한건 아님 고속도로 평지에선 130~140까진 뭐 밟고있으면 올라가는데 언덕에선 쥐약임. 엔진굉음만 나고 속도는 아주천천히 오름. 급가속해서 차선변경할때나 빠져나갈때 굉음이 상당함. 운전자는 불안하지않은데 조수석이나 뒷자리에선 무서워함. 쫌... 치명적이긴함 차 바꾸는 가장 큰 이유임. 참고로 사람들이 승차감 안좋다 소음크다 하는데 솔직히…"},
 "캐스퍼":{n:"캐스퍼",b:"현대",pr:1350,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/04/10/2891daf8-4d8b-42eb-8949-0a0c94ab22bb.jpeg",r:"2030 여성들의 이목을 끈다. 점심에 어디 차 세워 두고 있으면 꼭 쳐다보고 귀엽다며 수군거리심. 그리고 암만 “경차 치고 비싸비싸” 해도 경차 중에 성능 제일 좋고 빠지는 거 없음. 단 하나, ‘공간성’에선 기아의 레이가 우위인 건 사실. 그치만 그거 빼곤 모든 면에서 캐스퍼 압승. 캐스퍼한테 비주얼로 붙을 수 있는 경차 없고, 무엇보다 캐스퍼는 터보 기능 있어서 힘에 부치는 거 없이 매우 잘 달림.",c:"엔진 소음! 진짜 커요,,, 스포츠카 배기음급으로 터프한 사운드. 째깐한 게 아주 제법임."},
 "베뉴":{n:"베뉴",b:"현대",pr:1500,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/07/d6ca02be-35b7-4bfe-aab1-630bb2e90f85.jpeg",r:"매번 중고차를타다, 집사람이 처음으로 구입한 신차라, 아주 아끼며 탔고…출퇴근용으로 대부분운행한거라 연식대비 키로수가 매우 적습니다. 처음 차량을 접하시는 여성분또는 중고구입후 수리비걱정이신분은 아직 보증기간남은 신차같은 차량입니다.",c:"크게 불편한점은 없었고, 그냥 아이가 커가면서 조금더 여유있는공간의 차량이 필요해서 교체할려고 합니다. 사고이력은 아파트주차장에 주차된 저희차를 다른분이 범버쪽 가스를 내면서, 범버교환이력이 있습니다."},
 "티볼리":{n:"티볼리",b:"KG모빌리티",pr:1500,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/16/1756cc37-78a3-450c-9b91-adccef9cd855.jpeg",r:"사람들에게 쌍용 자동차라는 회사는 대부분 좋지 않은 이미지라는건 자동차에 조금이라도 관심이 있다면 아실겁니다. 하지만 쌍용차를 욕하는 사람들 중 쌍용차를 자가로 타본사람이 몇이나 될까요? 제가 탔던 베리뉴 티볼리의 장점을 몇개 말씀드리겠습니다. 첫째로 국내 경쟁사의 동급 모델들과 비교했을때 가장 저렴합니다. 저렴하다고 출력이 부족하거나 실내 공간이 부족하거나한점은 전혀 없습니다. 1.5터보 엔진으로 아반떼 트랙스 등 다른 차량들보다 월등히 높은 출력을 가지고 있어 밟는 재미가 훌륭합니다. 둘째로 디자인이 정말 예쁩니다. 물론 개인마…",c:"터보 차량이라서 그런지 터보렉이 조금 있습니다. 불편하진 않지만 전에 타던 차에 터보렉이 없었다면 적응하는데 다소 시간이 걸릴 수 있습니다. 과속방지턱 넘을 시 하체에서 삐그덕 소리가 납니다.(특히 겨울철) 티볼리 동호회에서도 유명한 고질병입니다. 쌍용에서 개선품이 나왔다고 하는데 확실하진 않습니다. 개선품이 나왔다면 교체 가능합니다. 제가 느낀 단점은 이정도 입니다. 정보가 더 필요하시다면 동호회 카페 가입 후 검색을 통하여 많은 도움 얻으실 수 있을겁니다."},
 "맥스크루즈":{n:"맥스크루즈",b:"현대",pr:1500,y:2018,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2025/12/22/ca65a5df-32a2-48c1-82b4-767948600e2a.jpeg",r:"차량 구매 당시 자녀 2명이 초등생이었는데, 모자람 없는 공간과 출력 덕분에 아주 쾌적하게 다녔습니다. 자녀 둘다 중학교 입학이후 예전처럼 다니기 쉽지 않아 세단으로 바꾸려고요. 잘 타고 다녔고 아직도 아쉬운 마음이네요.",c:"가족과 함께하기엔 더할나위 없지만, 일반 출퇴근용도로는 차가 큽니다."},
 "K3":{n:"K3",b:"기아",pr:1550,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/03/10/cc0c3224-c349-4cae-b237-16af9f3e1b20.jpeg",r:"실내공간은 나쁘지 않음 성인 남성이 뒤에 타도 그리 좁지 않은 실내 대신 뒷자리에 2명만 타야함 3명은 못탐. 130마력의 넉넉한 출력 실사용에서 차가 잘나감 물론 언덕 만나면 좀 힘들어하긴 함",c:"엔진 이슈 오일 감소로 인해 지속적인 스트레스 엄청난 관리가 필요함 기아의 랜드로버랄까? GDI 엔진 들어간 차는 다시는 타기 싫어짐 오일 감소로 인해 연소 시 찌꺼기 발생 엔진 내구성 저하 그렇지만 무상수리는 엔진 전체가 아닌 실린더 블록만 앗세이로 갈아줌 덕분에 실린더 헤드 맛 가서 차 팔게 됨 ^,^,,, 오토큐 견적 200가까이 나오는 극악의 자동차+오일 감소로 찌꺼기 생성=배출라인타고 촉매를 녹임=촉매교체 공임포함 150정도"},
 "SM6":{n:"SM6",b:"르노코리아",pr:1600,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/27/0407206a-54b7-47a9-ad9d-1032c5fbd8f6.jpeg",r:"뭐니뭐니해도 디자인입니다. 16년이 최초모델인데 지금나와도 질리지않는 디자인입니다. Lpe이며 도넛형태로 트렁크 모두 적재할수 있는 점이 큰 장점중하나입니다. 제가 길을 잘 들인건지 몰라도 Lpe임에도불구하고 고속주행시 흐름에 지장주는거 없고 초반스타트도 좋습니다. 정비도 쉬운편입니다.",c:"초기형 sm6의 토션빔문제점인 포트홀, 맨홀뚜껑들넘을때 나는 쿵,땅소리입니다. 너클류교체, 공기압조정등으로 어느정도 해결가능하다하나 근본적으론 후기형으로 교체하면된다합니다. 그리고 제가 키가 185라 그런지 실내가 좀 좁으나 이건 개인적인 사정이구요; 도심운행보단 고속주행이 많은분께 추천드립니다."},
 "말리부":{n:"말리부",b:"쉐보레",pr:1700,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/04/24/9c409cc9-3fe0-4077-9b9d-f122484a5030.jpeg",r:"안녕하세요 올뉴말리부 장점은 외관 디자인이라고 생각합니다. 30대 초반에 첫 차로 출고 받았는데 지금까지 정말 만족스럽게 운행을 했습니다. 직장생활 할때 월~금 자주 운전은 하지 않았고 주말에 운동하러 갈 때 여행 갈 때 근교 이동 시 주로 이용을 많이 했습니다. 평소 청소하는걸 좋아하고 더러운 꼴을 보지 못하기 때문에 손세차를 해왔습니다. 디테일 세차 후 광택 내는걸 좋아했습니다. 성격자체가 고속주행하는걸 별로 선호하지 않아서 RPM도 2천 중반까지 과하지 않게 운전하는 습관을 가지고 있습니다. 23년 8월 기준 티맵 운전점수는…",c:"타깝게 문콕, 휠 기스는 있는데 마음이 아프네요 휠 기스는 앞 바퀴 한쪽에 심하지 않게 살짝 긁혀있습니다 문콕은.. 지하주차장에 주차를 했는데 옆 차량이 한걸로 생각하고 있습니다."},
 "XM3":{n:"XM3",b:"르노코리아",pr:1700,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/05/7db49882-a5c7-4bc6-b22c-f222ec7e1b26.jpeg",r:"트렁크 공간 엄청남 개인적으로 동급중 디자인이 제일 이뻤음 도로에 별로 없는 유니크함 세로형 네비가 너무좋음",c:"오토홀드 후 출발할때 말타기함 경사로밀림방지 구림 뒷자석 공간은 트렁크에 몰빵한듯 열선시트 통풍시트 키려면 터치해야해서 개꾸짐 정비비 사악함 룸미러로 보는 뒤 시야 넘 좁음 베터리용량 작아서 오토스탑앤고 잘 작동안함"},
 "아반떼":{n:"아반떼",b:"현대",pr:1750,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/24/f77702d9-d2e2-4e87-a9f6-48dda17f12f1.jpeg",r:"장점 디자인 매력 인텐스블루 시원한 색감 연비 불량이 셀수없이많아서 신품부품교체가 좀 있음 교체부위보면 신차타는기분 블루핸즈 직원들과 친해짐",c:"뻥 뚫려있는 엔진룸하부 심각한단차 실내 잡소리 조잡한 마감 쓰레기같은 품질 가벼워서 나갔지 무거웠으면 절대못탔을 출력 실내 물 유입 매달 블루핸즈 출석체크 (이젠 직원들이 차만보면 뛰쳐나옴) 크락션 10번교체(무사고임에도 범퍼 15번내림) 심심하면 문제생김 매달 드라이브를 블루핸즈로감"},
 "코나":{n:"코나",b:"현대",pr:1850,y:2023,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/03/20/0bcc08f2-0387-4de8-a38e-948b7cba936d.jpeg",r:"일단 예뻤어요. 눈매가 아주 슬림하게 이쁘면서 푸바오 닮은느낌이라 해야하나 ㅎㅎ 그리고 저 혼자타기에 연비도 좋고 가성비 좋습니다.",c:"뒷자리는 아예 생각안하고 구매해서 그런지 가끔 뒷자리에 사람타면 좁아서 불편하다 그러더라도요."},
 "트레일블레이저":{n:"트레일블레이저",b:"쉐보레",pr:1900,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/04/14/92c7df84-8b2f-415a-b5c1-cac4fd99f1de.jpeg",r:"저의 트식이는 정말로 세련되고 멋진 외관으로 지나가는 차들도 쳐다볼 만큼의 미모를 지니고있습니다. Suv인 만큼 캠핑.차크닉 뭐든 편하게 누울수있고 초보운전자 분들도 편한 시야로 운전 할 수 있습니다.(파라노말 썬루프가 있어 하늘도 구경할 수 있으며 시원해보입니다) 색상도 질리지 않는 화이트 펄로 추가금 들고 구매했습니다. 작은 엔진을 가지고 있지만 전혀 차이를 못 느낄만큼 조용하고 시원하게 잘 나갑니다.(저공해 차량으로 되어 공영주차비 반값입니다) 무거운 짐들 들고도 불빛에 발을 비추면 트렁트가 시원하게 열립니다( 짐 많은 분들…",c:"주인을 잘 못 만난 단점 밖에 없습니다..평생을 함께 하고픈 아이였지만 해외 발령으로 차가 필요 없어져 눈물을 머금고 입양 보냅니다.. 부디 다음 주인분은 트식이와 좋은 추억 많이 많이 만들었으면 좋겠습니다."},
 "셀토스":{n:"셀토스",b:"기아",pr:1950,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/18/a22493dc-5d10-4f1a-a988-6ed5a1c086a9.jpeg",r:"2천 후반 ~ 3천 초반에서 느낄수 있는 가장 괜찮은 “소형 suv' 1. 현기차 답게 감가적음 2. 꽤나 준수한 연비 (2.0 기준 10정도) 3. 다양한 옵션 선택폭 4. 차급대비 커보이는 외관, 이쁜 디자인 5. 현기 치곤 꽤나 준수한 고속 안정성? 6. 차급대비 시원하게 잘나가! (패들시프트는 덤) 7. 잔고장, 고질병 크게 없어! (사골이라...) 8. 내가 바로 골목대장! 좁은 공간? 셀토스에겐 아무 문제없지",c:"1. 옵션좀 넣으면 3천... (이돈이면 스x티지, x싼) 2. 뭔 짓을 해도 “소형 SUV' 3. 노면과 딮 키스하며 다닐수있는 하드한 승차감 - 노면이 불안정하면 차안에서 트월킹 가능 - 장거리 타면 고려해야 할 제3의 비용이 있어 ... 유류비, 하이패스, “허리 치료비” - 요철넘는 스킬이 많이 늘어남 (30km 넘기면 작은 요철, 방지턱도 무서워져, 플라스틱 방지턱은 10km) 4. 코너링이 너무 불안해 - 일상주행에서도 코너링이 무서워 (차급에서 오는것도 있겠지만 트레x블레이저와 비교하면....) - 360 턴 구간에서는…"},
 "캐스퍼 일렉트릭":{n:"캐스퍼 일렉트릭",b:"현대",pr:2000,y:2024,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/24/dc5884ec-a56d-4408-997c-6eb6ad1d2fed.jpeg",r:"2030 여성들의 이목을 끈다. 점심에 어디 차 세워 두고 있으면 꼭 쳐다보고 귀엽다며 수군거리심. 그리고 암만 “경차 치고 비싸비싸” 해도 경차 중에 성능 제일 좋고 빠지는 거 없음. 단 하나, ‘공간성’에선 기아의 레이가 우위인 건 사실. 그치만 그거 빼곤 모든 면에서 캐스퍼 압승. 캐스퍼한테 비주얼로 붙을 수 있는 경차 없고, 무엇보다 캐스퍼는 터보 기능 있어서 힘에 부치는 거 없이 매우 잘 달림.",c:"엔진 소음! 진짜 커요,,, 스포츠카 배기음급으로 터프한 사운드. 째깐한 게 아주 제법임."},
 "QM6":{n:"QM6",b:"르노코리아",pr:2000,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/17/d121b6e6-a994-45ce-8abf-8e4def08384d.jpeg",r:"이 차값에 가히 최대 실내공간. 디자인 진짜 잘만듬. 정숙성 인정. 안정적 주행질감. 묵직한 핸들링. 저속~80키로까지 부드럽고 안정감 느껴지는 주행질감. 1.디자인 2.크기 3.주행질감 으로 먹고사는 '가 성 비' 차량.",c:"정숙은한데 가속만 밟으면 엔진 힘들어하면서 소음 남. 배기량이나 마력의한계. 송풍구에서 뜨신 엔진열 나옴. 가속력이 답답. 경사로 버거워함. SUV라 그렇겠지만 요철 방지턱 비포장도로등 에서 뒤뚱뒤뚱 꽤심함 코너시 롤링도 있음. 네비는 안드로이드오토로 쓰니 에스링크는 정말 쓸일없음. 에어컨필터 정비성 일반인은 극악. 휠얼라이먼트 미세하게 안맞음."},
 "코란도":{n:"코란도",b:"KG모빌리티",pr:2000,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/24/ac517de2-4a5d-43cb-9d5e-f25544476f8b.jpeg",r:"패밀리카로 최고임 카니발보다 좀더 길어서 실내공간유리 폭은 좀더 좁아서 주차에유리합니다 후륜구동이라 정숙하며 필요시 4륜가능 눈와도 걱정없는든든함 카니발대비 전자식옵션은 적어도 오히려 정비에 유리핟",c:"2열이 슬라이딩도어가 아닌점이 불편하지만 아이들안전을생각하면 그렇지도않음 타면서 고장 한번도 안났습니다"},
 "트랙스 크로스오버":{n:"트랙스 크로스오버",b:"쉐보레",pr:2000,y:2023,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2025/09/05/be5877b4-6011-4183-a52f-5afdc2de20df.jpeg",r:"소형suv 답지 않은 묵직하고 튼튼함 쉐보레가 자동차를 만드는 방향에 대해 잘 녹아 있는 차량이기도 함 부족하지 않는 성능 안정적인 고속주행감 당시 국산차들이 옵션들로만 치장하고 나왔지만 더뉴트랙스는 옵션은 부족하지만 정말 자동차의 기본기를 갖추고 나온 차임 더뉴트랙스를 몰다가 다른 국산차 소형suv를 몰았을때 운전 기본기에서 많은 아쉬움을 느낄 정도로 더뉴트랙스는 기본기 하나로 정말 잘 만든 자동차임.",c:"장점으로는 같은 급에서 최상급 자동차의 기본기를 갖추고 있지만 단점도 만만치 않게 가지고 있는 차량임. 첫째, 정말 잘 만들어진 자동차지만 냉각수 고질병이 있음. 물론 향후 신형 1.4터보 장착 차량은 예외지만 구형 1.4터보 엔진은 주행 마일리지와 상관없이 복불복으로 냉각수 누수 문제가 있음. 터보 쪽 냉각수라인은 기본 보증기간이 끝이나도 보증을 해주지만 다른 쪽에서 터지는 냉각수 누수는 예외임. 쉐보레의 높은 부품값, 수리비로 인해 가격이 많이 부담됨 둘째, 빈약한 옵션이 있음 코나, 셀토스 등 다른 국산차들과 비교 시 옵션이…"},
 "니로":{n:"니로",b:"기아",pr:2150,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/17/27c9b4fb-81a5-474b-a04e-9b947f45e55b.jpeg",r:"난생 처음 마음에 든 차 니로입니다 내 나이 80 에 가까왔습니다 죽기전에 오토크루즈콘트럴로 전국 일주 하려고 합니다 연비짱입니다 절전연비 용인에서 일산 왕복 30km할때도 있고요 (짐 뒤에 가득싣고 다시 구입해도 니로입니다 이 차 사시는 분 좋을것입니다 질 잘드려 놓았습니다 고속화도로만 거의 다녔으니깐요 감사합니다",c:"저는 단점은 못 느꼈습니다 더 좋은 차를 안타봐서요 많이 주행하니까 연비가 최고 기아센터에 점검한까 바테리 성능좋다고 하네요"},
 "쏘나타":{n:"쏘나타",b:"현대",pr:2250,y:2023,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/19/4f8ecd95-bfbd-48c3-97f9-d6c7eb477a9f.jpeg",r:"내가많이운행은 안했지만3년동안 타면서 고장한번없고 말성없어 너무좋은데 팔게된이유는 내가어렵게 기초생활급여를받게되었는데 차가있으면 취소하겠다하여 부득히 나를떠나지 않으면 안되어 너무아쉽게 생각되지만 내가살려면 어쩔수없이 둘다죽을수없기에 아쉬움을 남깁니다",c:"불편한점은 한번도 없었나봅니다 내가 나이가들어 운전도 그만둬야 될것도같고 90이다되었으니 운전은고사하고 인생마져 졸업할때라 그져 쓾.기만 하네요 누구든지 잘쓰세요"},

 "벨로스터 N":{n:"벨로스터 N",b:"현대",pr:2500,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/17/0e15feca-216e-4cab-bb79-c75e8fa35ac9.jpeg",r:"1600cc 터보 엔진 중 제일 큰 사이즈의 터빈이 들어가 다운쉬프트 후 경쾌하게 치고나가는 느낌이 아주 좋음 차도 작고 가벼워 와인딩이나 약간의 스포츠 주행에서 쏠쏠한 재미를 볼 수 있음 또한 자동차세가 적고 고속에서 연비주행 하면 트립상 15~18km/l까진 뽑아줌",c:"1.6 엔진 특유의 오일감소 이슈, 크랭크각 센서 이슈로 인해 평소 자주 엔진오일 양 점검을 자주해왔음. 리어 서스펜션이 토션빔 타입이라 얼라이먼트 작업도 매우 어렵고 대부분 카센터에선 얼라이먼트 작업 보단 토션빔 교환을 권유함 (부품값 비쌈) 네비게이션이 멍청함 ( 블루투스 연결이 갑자기 끊기기도 하고 핸즈프리 통화 소리가 찢어지고 시간이 안맞음) 운전석 문이 길어 좁은곳 주차시 타고내리기 힘듦, 뒷자리는 그냥 짐칸 용도로 써야됨"},
 "투싼":{n:"투싼",b:"현대",pr:2600,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2025/12/23/010da95d-5dca-4913-9f4d-abbc630e212f.jpeg",r:"잔고장하나없이 지금까지 소모품교환만으로 잘 다닙니다. 30만키로가 넘었는데 밋숀 상태좋구요. 엔진헤드도 상태good.엔진보링이 아직필요없이 출력좋구여, 언제나 처음새차같이 안정적인 800~900rpm을보여줍니다. 해서 아직까지 출력.급가속상태 안정적으로 밀어줍니다. ㅡㅡㅡ매력은 고속주행시 최고의 연비입니다.리터당16.8키로 넘겨봣네요. 10년을탓는데도 공인연비보다 더 잘나오는듯합니다.",c:"차체가 소형suv이다보니 조금 낮은게 흠이구여, 그것외엔 10년간 고장없이 잘 굴러가서 탈입니다요.^^"},

 "스포티지":{n:"스포티지",b:"기아",pr:2750,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2025/12/24/4cf11719-1890-478f-8024-89f237ae4134.jpeg",r:"스포티지를 중고차로 전달받았었는데 사회초년생이 끌기에 최고로 적합한 차였습니다. 자취방 이사할 당시에도 차 수납공간이 넓어서 한 번에 짐을 실어서 이동할 수 있었습니다. 세단이었으면 상상도 할 수 없는 장점이죠~",c:"디젤이었다보니 아무래도 엔진소음이 컸던 점이 있습니다. 하지만 이러한 단점도 적응이 되어 전기차 오너가 아니었다면 크게 불편함으로 느껴지진 않을 것 같습니다"},

 "EV3":{n:"EV3",b:"기아",pr:3000,y:2024,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/17/d7c8a649-ad18-403e-9b7c-ccde7da3d4f9.jpeg",r:"편안한 주행과 가속력 그리고 저렴한 유지비 그냥 핸드폰 처럼 충전하고 운행하기만 하면된다.",c:"전기차는 충전비를 아껴야 효뉼이 증대 효과를 누릴 수 있음. 집밥 혹은 직장밥이 있어야 함. 고속충전으로 유지한다면 하브 혹은 연비 좋은 디젤이 최고임 가장 큰 문제는 지방 일부지역에는 충전기가 없거나 저속충전기 혹은 대부분 고장으로 충전 불가. 아무리 휴게소 고속충전이 있다고 해도 부족한 수량 그리고 대기해야 하는 번거로움 가속을 즐기는 만큼 충전비용의 증가 전기차는 시내에서만 가성비가 최고임"},

 "G70":{n:"G70",b:"제네시스",pr:3200,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/14/4bb91088-4d60-4948-949f-eb97bbcb9f62.jpeg",r:"G703.3 타본 장점 요약 드립니다 1.정말 잘나간다 이게 국산차 맞나? 이렇게 잘나간다고? 괜히 암행으로 쓴게 아니구나 싶음 2.실내 마감이나 가죽이 정말 좋다 3.차가 정말 이쁘다 4.국산차라 수리비가 저렴하다",c:"1.쌈@뽕한 쓰레기 연비 도심2.1나온적도 있었음 2.저는 혼자 타는거라 실내 좁은건 아예 신경도 안쓰지만 남들이 뒷자리 보면 신기해함 너무좁아서 3.너무 부실한 하체 g70대부분 고질병 하체 잡소음 및 하체 문제 4.단점인듯 장점인듯한 딱딱한 승차감 5.3.3터보 엔진오일 피드 파이프 누유(리콜대상임 리콜해줌) 6.버러지 미션 총평:스피드를 즐기며 혼자타기는 정말 최고 하지만 가족이있고 짐이 많고 연비 신경쓴다 패스~"},
 "렉스턴":{n:"렉스턴",b:"KG모빌리티",pr:3200,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/04/4180dc3b-06a8-43c1-8b44-86ab70060aa5.jpeg",r:"디젤엔진으로 주행시 소음 진동이 많을거라 생각했는데 실제로 운전해보니 정속주행시 소음이나 진동이 거의 없어서 좋아요 그리고 차체가 높고 덩치가 있어서 주행시 시야확보가 용이하고 고속주행시 흔들림 없이 듬직해요",c:"차량이 좀 길고 폭이 넓어서 시내 또는 주차와 유턴이 어려웠고 특히 지하 주차장은 이용이 쉽지 않아요."},

 "스타리아":{n:"스타리아",b:"현대",pr:3300,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/22/091cd27c-65bb-4f53-b16e-482add1f443a.jpeg",r:"버스전용차로 달릴수있고 2열3열이 서로 마주보면서 노가리 까는거도 가능합니다 2열은 열선 통풍까지 있어서 딱이구요",c:"머리가 커서 불편 코너링 승차감 그닥입니다 직진고속은 나쁘진않ㅇㅏ요 2.2디젤 조금 답답합니다"},
 "싼타페":{n:"싼타페",b:"현대",pr:3350,y:2023,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/18/1288ed56-332b-47f6-a2e8-b0ed88e1466f.jpeg",r:"차량상태가 정말괜찮습니다. 타이어편마모나 핸들떨림, 쏠림등이 전혀없으며 30만km넘는 주행거리중최소 70%정도는 고속정속주행한 차량으로 엔진, 밋션상태또한 정말 쌩쌩하고 하체부식또한 거의없는상태입니다. 년식에비해 매연도 적어서 4등급 조기폐차도 고민했지만 아직 멀정한 차량을 없애버리기엔 아쉽기도하고 자원 재순환문제등도 고민이 돼서 요긴하게 쓰실분들이 가져가시길 바랍니다. 매각사유는 신차구입입니다.",c:"아직까지 큰고장 한번 나지않고 말썽부린적도 없지만 디젤차량이다보니 진동이나 소음은 어쩔수없네요. 장거리 고속주행위주로 사용한본인은 요즘차량에 거의필수인 크루즈기능이 없어서 젊었을땐 느끼지못했던 불편함을 요즘 느끼고 있습니다."},
 "쏘렌토":{n:"쏘렌토",b:"기아",pr:3450,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/04/14/cf6dabd9-b130-4cd1-adec-0b35e493a9f7.jpeg",r:"쏘렌토는 완벽한 차량입니다. 하이브리드의 연비까지 더해진다면 최고의 패밀리카임은 모두가 인정하는 사실이죠 페이스리프트를 거쳐 무선 카플레이와 조향인지가 향상된 자율주행시스템 등 더욱 더 완벽하게 거듭난 쏘렌토입니다.",c:"18인치 순정휠에서 20인치로 바꾸고 나니 약간의 승차감 저하가 있었습니다.. 하이브리드는 18인치가 좋은 것 같습니다"},
 "EV6":{n:"EV6",b:"기아",pr:3500,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/23/c612131a-b27f-4221-8d82-4e66ccd7feab.jpeg",r:"정말 좋은 차였죠. 얘와 함께했던 시간들이 너무나 행복했어요. 이렇게 가격이 무너질 거란 걸 알지 못했으니까요. 한마디로 망한거죠. 하지만 타보지도 않고 까지는 마세요. 깔 거면 맞다이로 들어와.",c:"어두운곳 충전시 덮개를 열면 충전게이지가 밝아 눈뽕에 상대적으로 어둡게 보여 충전구 찾기가 힘듦. 충전게이지 불빛이 충전구로 향해 있었다면 더할 나위 없을것으로 생각됨."},
 "K9":{n:"K9",b:"기아",pr:3500,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/17/4f907467-32b3-4e04-95fe-ce3f993c27f2.jpeg",r:"4년전 29살, k7신차로 갈것인가(그때 당시20년도 풀옵 대략 4000만원) or중고 독3사 D세그먼트 세단(괜찮은 매물들은5000까지도 생각을 했었죠 고민끝에 중고로 차급을 올려 기아자동차 플래그십을 4050만원에 구매 했었는데요 젊은 나이지만 저는 브랜드 네임밸류보단 실용성,승차감을 1순위로 뒀고 그 결과 대 만족 !! 행복했습니다 만 4년동안 저의 애마가 되어준 k9에게 깊은 애정을 느꼈고 자동차를 더 깊이 알게 되고 폭넓게 관심을 갖게된 계기가 되었습니다 .. 자동차라는게 운송수단 그 이상의 가치를 한다는걸 k9을 만나면서…",c:"불편함 단점 잔고장 한번 없는 완벽한 차량이었습니다"},
 "K8":{n:"K8",b:"기아",pr:3550,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/23/51f86c54-4959-411e-a68a-0f33ddb7c211.jpeg",r:"대형 세단은 이만한게 없는것 같아요 외관은 호불호가 갈리지만 실내 정숙성이나 부족함 없는 드라이빙 성능 그 무엇보다 공간은 정말 다른 차들은 못따라올 정도로 넓습니다 하이브리드인데 대형 세단 치고 엄청 잘나오구요! 가성비로 차에 대한 모든 기능을 느끼면서 부드러운, 정숙한 질감의 드라이빙과 그 컨셉에 맞는 내부 기능들을 즐기고 싶다면 선택하세요",c:"제가 주로 듣는 음악들이 베이스 강한 음악들인데 메르디안과는 맞지 않는것 같아요 또 하이브리드다보니 트렁크 용량이 생각보다 조금 부족하다고 느낄 때가 많습니다"},
 "아이오닉6":{n:"아이오닉6",b:"현대",pr:3600,y:2023,p:"",r:"막내 자식같은 차를 떠나보내게돼서 많이고민했습니다. 초창기 전기차 나올때 신세계를 맞보게 해주었고 정숙함.운전재미.스트레스가 거의없던 착한녀석을 보내게돼어..마음이아픕니다. 세단이라 아이들이 커가서 그몸집을 suv로넘어가야할꺼같아..중고로 올립니다. 혼자탈땐 더할나위없이 스포츠카 느낌으로시원한 드라이브도 재밌었습니다. 한번도 고장난적 수리간적없고 전기차라 집안 가계에 도움만 주고 이렇게 보내게됨을 참 슬픔니다.몇년(3~5년)만굴리면 이녀석은 차값보장합니다. 늘주기만 한 이녁석을 다음 주인에게도 잘 하리라 마음으로나마 응원합니다. 기…",c:"잘나간다고 너무 달리진마세요~ 그냥 박차고나갑니다. 아.현대껀 회생제동스위치가있어 잡아주니 원페달 드라이브 강추입니다~"},
 "그랜저":{n:"그랜저",b:"현대",pr:3650,y:2023,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/21/b3a5023e-833d-4ce9-9824-31eaaae1ee6a.jpeg",r:"3.0 6기통 LPI의 넉넉한 출력과 정숙성 두가지 모두를 잡은 매력적인 모델입니다. 거짓말 조금 보태면 정차중이나 주행시 엔진소음이 거의 없어 전기차 같은 느낌입니다ㅎㅎ 과거의 출력 약한 LPG 차량들과 비교 불가입니다. 그리고 넉넉한 실내 공간으로 뒷자리 건장한 성인 3명이 타도 큰 불편함이 없습니다. 풀옵션 기준 4500만원 이하 대한민국최고의 가성비 모델이 아닐까 합니다. 🚙👍😊",c:"도넛형 충전용기로 바뀌면서 충전용량이 약 50리터 정도 밖에 안됩니다. 그래서 저같은 경우 일주일 500km 운행하는데 두번씩 충전소를 가야하는 불편함이 있습니다. 그리고 트렁크 밑바닥 높이가 높아 높이가 높은 짐은 실기가 조금 힘이 듭니다ㅠㅠ"},
 "콜로라도":{n:"콜로라도",b:"쉐보레",pr:3800,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/10/011fee98-db72-4cbf-86c0-030be9e43fb8.jpeg",r:"1. 차 기장이 길고 높이도 높은편이라 트럭답지않게 멋있는편 2. 차값보다 비싸게봄 3. 캠핑/낚시/보트견인 최적화된차 4. 카니발보단 폭이좁아서 주차는 의외로 편리함 5. 3.7 자연흡기에서 나오는 시원한 가속 6. 전방추돌방지덕분에 딴짓하더라도 시끄러운 경고음덕분에 피한적 많음 7. 프레임바디치고는 승차감 괜찮음 8. 빵빵한 오디오로 귀가즐거움 9. 패들쉬프트자리에 볼륨조절버튼/다음곡이전곡 버튼이 있어서 아주 자연스럽고 편하게 노래감상이 가능함 10. 출고타이어 마일리지가 높음 아는분이 사는거보고 따라산건데 이분은 2년동안 10…",c:"1. 락폴딩안되서 손으로 접었다폄 2. 누수있어서 뒷유리 몰딩교환(300km탔을때) 3. 보령미션급으로 멍청한 미션 4. 1만키로가까이 주행했는데도 학습을 안한건지 덜한건지 냉간상태에서 주행하면 변속충격 매우심함 5. 3.7 자흡 가솔린 + 8단미션의 조합에서 오는 시원한 가속력은 둘째치고 연비가.. 시내 평균 4~5km/L(거짓말아님 진짜임) 고속 평균 7~9km/L(거짓말아님 진짜임) 최종복합연비는? 평균 6.3키로(트립기준) 구매후 5개월동안 약 9500키로 주행 총 유루비 약 250만원 지출 1년타면 기름값만 600만원쓰는차…"},
 "카니발":{n:"카니발",b:"기아",pr:3850,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/24/292de727-8c10-44bc-8ff8-c677ca64547a.jpeg",r:"말해 무엇하나요. 넓은 실내, 7인승이라 큰 짐도 실을 수 있는 3열폴딩.. 이전 세대에서는 기대하지 않았던 고급스러운 인테리어 디자인, 편의장치들. 왜 다들 카니발 카니발 하는지 느낄 수 있었습니다.",c:"승용차를 운전하다보니 당연한 이야기지만 차체가 커서 주차할 때 주차칸이 좁아서 불편하긴 했습니다. 하지만 넓은 실내공간의 장점과 비교하면 감내해야하는 부분인게 당연한거겠죠"},
 "트래버스":{n:"트래버스",b:"쉐보레",pr:4200,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/22/b8312983-8a91-4e5b-8a34-a017dc12dd61.jpeg",r:"SUV지만 승차감이 진짜 좋고, 힘도넉넉하면서 편안해요. 넓고 캠핑하기 좋고 가족수 많아도 문제없어요. 운행시 안정감이 있고, 튼튼하고 잘만든 섀시에서 차의 기본기가 정말충실한 차량임을 느낄수 있어요.",c:"큰 덩치로 인해 차에 적응하기 전까지는 구형 건물 지하 주차장 같은 곳이용이 약간 어려울수 있어요."},
 "팰리세이드":{n:"팰리세이드",b:"현대",pr:4300,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/24/502d2c81-6fb9-463b-981a-c4f2a36768bd.jpeg",r:"넓은 실내공간, 부드러운 주행감, 각종 안전장치등 솔직히 외제차 포함 패밀리카로는 이만한차 없다고 생각합니다.특히 어라운드뷰는 큰 차체의 단점을 무색하게 했고, 캄캄한 비오는날 후진하다가 장애물에 충돌할뻔 했는데 충돌방지 센서가 작동하여 긴급제동을 해서 파손을 막을수 있었습니다. 여러모로 만족스럽게 운행했습니다.",c:"차체가 크다는점 빼고는 단점은 없는것 같습니다. 기본으로 장착된 어라운드뷰와 주차보조시스템이 있어서 그다지 불편함을 못느꼈습니다."},
 "모하비":{n:"모하비",b:"기아",pr:4500,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/18/8fb10ab1-af77-4226-be3f-4138e199c3c9.jpeg",r:"모하비! 정통 오프로드 전용으로 탄생한 차죠 프레임 타입이라 정말 안전하단걸 운전석에 앉아 보면 느낍니다 그리고 디젤 차량답지 않게 조용합니다 노면에서 올라오는 잡소리 이런거 전혀 없어요 글구 3.0 이라 힘 끝네줍니다!!! 모하비 단종시키지 말고 지속적으로 생산 하세요!!!",c:"딱 2가지 입니다! 첫번째는 승차감 두번째는 연비 입니다 앞쪽은 불편하지 않지 만 뒷 자석 탑승시 노면 충격이 있습니다 프레임 타입이라 당연~~~ 글구 연비는 보통출퇴근시 7km 나옵니다 그래도 전 다시 모하비 뽑을 겁니다!"},
 "GV60":{n:"GV60",b:"제네시스",pr:4500,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/22/aaa0991c-b7cb-40cd-8bdf-d7402cec5789.jpeg",r:"제네시스 브렌드 첫전기처로....하차감도 나쁘지않았고 내연기관대비 유지비가 저렴해서 좋았습니다. 가속력또한 말할것없이 국내최고였구요.",c:"트렁크가 작아서 큰짐은 힘들어요. 1.2인정도 간단한짐은 충분하고 골프빽은 2개는 가능합니다 꾸겨넣으면 더 가능하겟지만 비추 뒷자석폴딩시 3인탑승 라운딩 가능"},
 "GV70":{n:"GV70",b:"제네시스",pr:5300,y:2023,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/24/28161e3e-9413-4b5b-9b5e-7d3d6ad8f2ba.jpeg",r:"차는 국산차지만 외제차 느낌에 스멀스머나는 아주 스마트한 기능이 탑제된 최고의 차입니다 주행시 안정감이 좋앚고속도로 운전이취약한 저도 편안하게 운전할수 있었죠",c:"불편함. 고장. 1도 없이 아주 완벽했죠.. 그럼에도 이차를 급히 처분하는 이유는 차가 럭셔리하다보니 지도 럭셔리한걸로 착각한 남편새끼가 이차로 골프치고 다니며 외도를 일삼아 차까지 오만정이 떨어져 급히 매도하게 되었네요 차가 고급스러운거지.. 운전자가 고급스럽다는 자만은 금물!!!"},
 "G80":{n:"G80",b:"제네시스",pr:5500,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/20/f3ca647b-77be-4919-9123-0adbf5c7818b.jpeg",r:"신차 출고후 여성1인 무흡연차로 2년동안 실 주행거리 18,000킬로이며 실내인테리어는 최고옵션으로 나파가죽시트(운전석과 보조석 안마기능)에 실내 고급 장미무늬목과 내장 정품블랙박스, 고스트도어클로징까지 출고가격만 7천만원 이상 들었습니다. 엔진오일등 소모품은 쿠폰을 활용하여 매 주기적으로 점검을 받았으며 내년(2024년)까지 쿠폰이 남아 있습니다. 손세차만 할 정도로 애정을 가지고 있었는데 금번 신차 구매로 새로운 주인께 보내고자 합니다.",c:"아직까지 잔고장 없었으며 카센터에 가본적이 없었습니다. G80의 특성인지 회전반경이 큰편이라 주차가 좀 힘들었습니다. 썬글라스 콘솔이 없어 불편합니다."},
 "카니발 하이브리드":{n:"카니발 하이브리드",b:"기아",pr:5500,y:2024,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/24/4da52357-dc41-4fa7-be66-8247b61f521e.jpeg",r:"말해 무엇하나요. 넓은 실내, 7인승이라 큰 짐도 실을 수 있는 3열폴딩.. 이전 세대에서는 기대하지 않았던 고급스러운 인테리어 디자인, 편의장치들. 왜 다들 카니발 카니발 하는지 느낄 수 있었습니다.",c:"승용차를 운전하다보니 당연한 이야기지만 차체가 커서 주차할 때 주차칸이 좁아서 불편하긴 했습니다. 하지만 넓은 실내공간의 장점과 비교하면 감내해야하는 부분인게 당연한거겠죠"},
 "타호":{n:"타호",b:"쉐보레",pr:6000,y:2023,p:"",r:"2열,3열승차감이 운전석보다 좋아 가족차로 알맞습니다 실내공간이 넓어 특히 장거리이동시 피로감이 덜하고 쾌적합니다 안전성부분이 우수해 안심이 됩니다 오히려 주행하기에는 기존차량보다 안정적이였고 운전피로도도 덜했습니다(기존차 소렌토)",c:"비싼세금,연비안좋음,차량이크다보니 주차할때,좁은길주행시 신경쓸점이많음, 차가크다보니 혹시나 운전실수로 다른차량이나 보행자가 다치면큰일난다는생각에 긴장이 더됨."},
 "아이오닉5 N":{n:"아이오닉5 N",b:"현대",pr:6000,y:2024,p:"",r:"밟으면 밟는데로 쭉쭉 나가서 좋습니다. 치솟는 기름값에 별로 신굥쓰지 않아 좋습니다. 각종 편의 시설도 좋습니다. 캠핑가서 추우면 차안에서 안심하고 히터틀어놓고 잘 수 있어 좋습니다.",c:"충전에 시간이 많이 걸리는 건 좀 불편합니다. 최근에는 충전소가 많이 생겨서 충전소 찾는 불편은 많이 줄었습니다. 아파트에도 전기차 주차구역이 별도로 생겨서 좋습니다."},
 "GV80":{n:"GV80",b:"제네시스",pr:6400,y:2023,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/03/11/cf30ac05-b6ea-485e-80c4-1e0f2e1c45ba.jpeg",r:"지난 4년여간 저희 아버지를 안전하게 지켜준 차량입니다. 지금은 병마와 싸우시다 돌아가셨지만, 이 차를 구입하시고 기뻐하는 모습은 잊을 수 없습니다. 제가 버스를 타고 다닐때 항상 이차량을 이용해 터미널까지 데려다주시던 그때가 아직 기억에 남습니다. 한차례 사고에도 아버지를 지켜주었던 차량입니다. 이제는 더이상 지켜줄 사람이 없어 차량을 판매하려 합니다. 길에서 이차를 볼때마다 아버지 생각이 떠오를 듯 합니다.",c:"불편함은 전혀없고 고장도 없었습니다. 단 차가 크기에 좁은곳 주차는 불편하지만 원격전후진기능이있기에 좁은공간이라해도 쉽게 차를 넣고 뺄수 있습니다."},
 "EV9":{n:"EV9",b:"기아",pr:6600,y:2024,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/23/9de81cf4-26d7-45a8-84a3-e3c8f8326bf2.jpeg",r:"대형 + SUV + 전기차 + 99.8kwh + 6인승 비싸다고 하지만 EV6와 비교해보면 그렇지도 않은 것 같습니다. 승차감도 좋고, 큰 덩치에 가속감도 좋아요. 실주행시 약 5km/1kwh 정도라서, 펠리세이드와 비교시 경제성도 뛰어납니다. 최신 전기차답게 온갖 안전장비들이 갖춰져 있다는 것 또한 매우 큰 장점입니다.",c:"회전반경이 커서, 큰 차 운전해보지 않은 분들은 당황할 수 있어요."},
 "아이오닉9":{n:"아이오닉9",b:"현대",pr:6800,y:2025,p:"",r:"막내 자식같은 차를 떠나보내게돼서 많이고민했습니다. 초창기 전기차 나올때 신세계를 맞보게 해주었고 정숙함.운전재미.스트레스가 거의없던 착한녀석을 보내게돼어..마음이아픕니다. 세단이라 아이들이 커가서 그몸집을 suv로넘어가야할꺼같아..중고로 올립니다. 혼자탈땐 더할나위없이 스포츠카 느낌으로시원한 드라이브도 재밌었습니다. 한번도 고장난적 수리간적없고 전기차라 집안 가계에 도움만 주고 이렇게 보내게됨을 참 슬픔니다.몇년(3~5년)만굴리면 이녀석은 차값보장합니다. 늘주기만 한 이녁석을 다음 주인에게도 잘 하리라 마음으로나마 응원합니다. 기…",c:"잘나간다고 너무 달리진마세요~ 그냥 박차고나갑니다. 아.현대껀 회생제동스위치가있어 잡아주니 원페달 드라이브 강추입니다~"},
 "GV80 쿠페":{n:"GV80 쿠페",b:"제네시스",pr:7000,y:2024,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/06/f280e20b-c5cd-4291-9e37-79491a837c24.jpeg",r:"지난 4년여간 저희 아버지를 안전하게 지켜준 차량입니다. 지금은 병마와 싸우시다 돌아가셨지만, 이 차를 구입하시고 기뻐하는 모습은 잊을 수 없습니다. 제가 버스를 타고 다닐때 항상 이차량을 이용해 터미널까지 데려다주시던 그때가 아직 기억에 남습니다. 한차례 사고에도 아버지를 지켜주었던 차량입니다. 이제는 더이상 지켜줄 사람이 없어 차량을 판매하려 합니다. 길에서 이차를 볼때마다 아버지 생각이 떠오를 듯 합니다.",c:"불편함은 전혀없고 고장도 없었습니다. 단 차가 크기에 좁은곳 주차는 불편하지만 원격전후진기능이있기에 좁은공간이라해도 쉽게 차를 넣고 뺄수 있습니다."},
 "G90":{n:"G90",b:"제네시스",pr:9500,y:2023,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/04/01/32f2bd05-35b2-4e21-9817-0cc9e76a450d.jpeg",r:"벤츠 S580을 타다가 G90으로 바꾸었습니다. 벤츠도 2021년 신형이었습니다. 그런데 깜짝 놀랐습니다. 타본 사람만이 알 수 있을 것 같습니다. G90이 모든 면에서 앞선다고 자신 있게 말할 수 있습니다. 더욱 빛나는 것은 한국형 네비게이션과 편의 시설 등 입니다. 타보지 않고 비교할 수 없습니다. 차를 바꾸시려면 벤츠보다 G90을 선택하십시오~! 그 선택에 후회하지 않을 수 있습니다.",c:"잔고장이나 불편사항이 단한번도 발생하지 않았습니다. 제네시스 칭찬합니다."},
 "3008":{n:"3008",b:"푸조",pr:2200,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/04/08/df38322d-fe8f-42e4-b9d7-b97a69e0c548.jpeg",r:"디자인, 다양한 디자인 아이디어와 갬성이 넘친다. 대중차 브랜드인데 럭셔리라는 평가를 받는 이유가 있다. 오해는 하지말자 비싼 차가 아니다. 유니크함과 재미로 고급감을 준다. 예를 들어 아이콕핏. 가만히 생각하면 원가절감 아이디어인데 결과는 너무 마음에 든다. 피아노 건반 스타일의 독특한 물리 버튼 등 ..주행성능. 스펙은 특별난게 없어 보이는데 지향점이 명확하다. 핸들링 좋고 회전반경도 짧고 주행감도 좋고 울컥거림도 없고 일상적인 운전이 너무 편하다. 연비.. 고속도로를 달리면서 연비를 보면 행복해진다.. 디젤은 뭐라해도 푸조가…",c:"서울기준. 정비센터 예약하려면 한두달전에 해야합니다."},
 "골프":{n:"골프",b:"폭스바겐",pr:2400,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2025/10/20/664bf868-80c7-42ab-9797-3f72e65aeba5.jpeg",r:"- 외관은 평범한 골프6세대 디자인이지만 탑이 있어서 특별해진 그런 디자인입니다. 보통 오픈카는 주위의 시선을 끌기 마련인데, 이 녀석은 남의 시선이 따갑지 않으면서, 차를 좀 아는 사람들의 시선만 약간 끄는 정도 입니다. 물론 오픈하면 많이들 쳐다보시긴 하지만요^ 평범한 디자인이지만 '물방울 헤드라이트' 와 '데루등' 등이 있어서 좀더 고급스러워 보이긴 합니다. 탑을 닫았을 때 해치백도 아닌것이 쿠페도 아닌것이 어정쩡한게 어찌보면 이상한 못습이지만 제가 볼땐 독특해서 정이 갑니다. 탑을 열었을 때도 그렇게 튀지 않는 모습도 좋습니…",c:"쇼바를 내리고 훨이 크다보니까. 방지턱을 빨리 넘으면 차가 많이 꿀렁거립니다. 비포장도로만 아니면 승차감은 좋습니다."},
 "쿠퍼":{n:"쿠퍼",b:"미니",pr:2500,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/04/06/702749c9-7ab2-4780-9de9-b9f3392d7e86.jpeg",r:"이쁘고 하부가 튼튼합니다. 역주행사고시 알브이차량과 스타렉스차량 두대가 치고갔지만 저는 에어백이 살렷고 차는 찌그러지는것이 아닌 철판찢어지므로 작지만 안전면에서는 소형차치고는 튼튼합니다. 역시 독일차는 다릅니다. 두번째차량도 미니구입으로 타고 잇엇습니다",c:"시동과함께 셋팅을 해야한다는거요. 정말 마니아만 타야한다는거 고속도로 달릴때 하브소음이 좀 잇어서 불편햇어요"},
 "캠리":{n:"캠리",b:"토요타",pr:2900,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/06/40d2d076-1f3e-4a1b-8206-e2130b68a0f0.jpeg",r:"처음 차를 타는데도 별로 낯설지 않은 느낌이라 안전하고 편안한 운전이 가능했고 최고의 장점은 공식 연비 보다 월등히 높은 연비 그리고 기존의 일본차보다 강하게 쪼여진 서스펜션과 차량 자체 세시의 높은 강성때문에 차량의 운동성능이 뛰어남.",c:"하이브리드 특성 때문에 워낙 조용한 배터리 주행후 엔진이 가동될때의 상대적으로 엔진 소음이 높게 느껴지는 점, 오일 점검만 제대로하면 부품의 고장은 제로. 도요타 차량 내구성능은 전세계 메이저 자동차 업체들의 벤치마킹 대상이라는 사실 확인할 수 있슴."},
 "티구안":{n:"티구안",b:"폭스바겐",pr:3000,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/02/19/59ca593c-d7d5-4ca8-bdcc-fa3912564fb1.jpeg",r:"2015년 5월 폭스바겐 인증중고차로 인수해서 8년째 발이 되어준 녀석입니다. 무사고 차량으로 현재 210000km 정도 됐구요. 주말캠핑과 지방출장 등으로 고속도로 주행이 많아 차량 컨디션은 좋습니다. 티구안은 운전 편하고 패밀리카로도 큰 부족함이 없는 팔방미인 차량입니다. 장착 RCD330 plus (애플카플레이) 디컷 핸들 크루즈컨트롤 아우디 RS 정품 기어봉 신형 티구안 18인치 킹스턴 휠 툴레 윙바엣지 + 하프로 제니스 루프박스 6.6 실내 LED등 교환 작업 최근 주요정비 201553km : EGR어셈블리 교체 + 흡기크…",c:"주행거리가 늘어남에 따라 고질적으로 교체가 필요한 품목들이 있어요. 이를테면 플라이휠이나 egr밸브 같은 부품들이죠. 물론 다 교체 완료했구요."},
 "프리우스":{n:"프리우스",b:"토요타",pr:3000,y:2023,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/19/ec44b13e-e410-4738-a969-c43647c4fb78.jpeg",r:"해외로 이사가는게 아니면 끝까지 팔지 않았을 내 첫 딸내미 다음차도 프리우스를 사고 싶을 정도로 좋은차 17년동안 고장이 한 번도 없었음 미국에서 사서 들고왔고 한국에 프리우스 수입되기 전 모델이라 딱 한대밖에 없는 차 자동차정비기능사있는 주인을 가진 멋진차",c:"한국토요타 서비스 별로고 비쌈 외국차라 일반 수리센터에 자가검진기 기가 없는 경우가 없어서 기억소거가 안되어 알람이 들어와 있음"},
 "어코드":{n:"어코드",b:"혼다",pr:3000,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/14/0fa424fd-2af5-486e-bd04-440ce3a88f5a.jpeg",r:"신발과같은 존재이죠 어디를가나 반쪽같이 니가있어 갈수 있고 올수 있고 밥대신 기름만 주유하면 어디든 가든 니가 해결해주었는데 무심하게 이제는 너를 보낼려고한다 더좋은 주인님과 동행했으면 좋겠구 고장한번 안난 너였는데 끝까지 관리잘 받아서 새로운 주인님 기쁘게 해주길 바란다 ^^",c:"살다보면 사람도 어디든 아프지만 크게 아픈곳이 없어 카센타한번 안간 똑불어지는 녀석이였습니다"},
 "RAV4":{n:"RAV4",b:"토요타",pr:3200,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/03/24/9bf30acf-c6b5-40fd-aac5-d940e2c0525b.jpeg",r:"세상에서 가장 인기있는 SUV 라브4 그중에서도 현존 가장 효율적이고 우수한 기술의 토요타 하이브리드 차량입니다. 평균연비는 보통 리터당 20키로 전후, 크루징이든 스포츠주행이든 시원시원하게 쭉쭉 치고나가는 넉넉한 출력. 일상에서의 도심주행, 캠핑시 짐 적재 뭐 하나 빠지지 않는 명차라고 생각됩니다.",c:"연비가 너무 좋아서 주유를 한달에 한번 정도밖에 안하다보니 가끔 주유소를 갈때마다 조금 어색하기도 합니다."},
 "모델3":{n:"모델3",b:"테슬라",pr:3300,y:2023,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/11/b576163e-c318-46c2-b4e9-f1cc6286f3db.jpeg",r:"스트레스 없는 시내주행과 대중교통을 이용하는것 같이 저렴한 유지비가 좋네요. 집밥이나 회사밥중에 한군데만 있으면 최고의 조건입니다. 순간가속력도 너무 좋고 장거리 운전해도 피곤한 느낌이 별로 없어요",c:"하부에 배터리가 있다보니 승차감이 조금 떨어집니다. 대신에 시트가 좀 편합니다. 그래서 괜찮았구요 그 외엔 다른 불편한점은 없었어요"},
 "아테온":{n:"아테온",b:"폭스바겐",pr:3300,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/08/ceb257e8-5dd1-4789-b422-627912301ee2.jpeg",r:"장점이 많아 다 쓰기 어렵지만 한번 써볼게요...^^;; 첫째. 디자인...디자인으로 깔래야 깔 수 없는 차가 바로 아테온 입니다. 쿠페형으로 떨어지는 옆라인, 프레임리스 도어, 전체적으로 조화로운 라인 처리 등등...디자인하면 빠질 수 없죠 둘째. 연비...고속도로에서 작정하고 연바운전하면 25~28 쌉가능. 그냥 맘편히 적당히(140전후) 밣고 다니면 19키로...연비는 정말 잘나옴 셋째. dcc...이 가격의 차에서는 볼 수 없는 옵션인것은 분명함. 최대 16단계로 조잘되는 서스펜션 강도!! 가족들과 함께라면 구름위 편안한 주…",c:"아무래도 디젤이다보니 진동과 소음은 어쩔 수 없이 불편했습니다. 그리고 하체 잡소리가 조금 있어요. 그거빼고는 만점"},
 "CR-V":{n:"CR-V",b:"혼다",pr:3300,y:2023,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2025/07/11/1d68f056-7ed9-4125-a583-5ce3a735c644.jpeg",r:"메인터너스 외에는 고장없고 17년타면서 불만 없이 잘탔습니다 실내도 산타페 구형과 비교할정도로 넓고 편했고 가솔린이라 디젤보다 조용하고 핸들링이 SUV치고 좋고 운전하기도 편했습니다 다시 신형 구입을 검토할정도로 개인적으로 만족한 차량입니다 SUV 미국누적판매순위권의 이유가 있을만큼 판매대수의 장점이 있습니다 또한 VTEC엔진의 반응과 파워도 좋은편이고 다잇엔 디자인도 우수했고 동일연도 판매차량중 아직까지도 인기있는차량임을 노보스 유트브 보심 확인 가능합니다 장저과 매력이 넘치는 차를 17년간 보유하면서 4WD 매력을 느껴보며 젊은…",c:"부품수급은 잘되는데 정품 서비스 센터는 비싼 단점이 있어 행사시나 혼다 전문 사설정비를 이용했습니다"},
 "CLA":{n:"CLA",b:"벤츠",pr:3500,y:2022,p:"",r:"2인승으로 아주적합 시원한 가속력 45amg 4기통 2000cc 무려 단조공정엔진 탱크 엔진으로유명 나름 신형엔진이라 가스켓류가아닌 고온고열 실리콘으로 마감 누유도 없음 . 간혹 누유로 보이는 오일가스 비춤 보이나 누유로진행되는게 아닌 말그대로 그냥 오일가스새는정도 외에 엔진 문제가 전혀 없는 고성능 차량 현대 신형r엔진이 이엔진구조를 배껴만듬",c:"단점은 dct밋숀의 이질감 비엠zf8단에 비하면 아 이건 고장난게 아닌가 ? 하는 생각이 드는 초반 기어들어가는 느낌.. 중고속에서 기어 체결느낌은 아주 좋음 고질병 뮤조껀 고장나는 전자식 서모스탯 열림,닫힘 고착 오일펜안 압력센서? 무조껀 고장남 한번은 수리해야함 디퍼런셜 고장 소음, 갱장히~ 딱.딱.한 승차감 하지만 위 모든 단점을 엔진하나로 상쇄가능 중통교체혹은 배따기로 배기음과 팝콘도 챙길수있음 현시점 중고가 기준 구매후 고질병수리하는비용까지 포함해도 아방떼n 보다 저렴한금액에 훨씬 고급스런 고성능차를 탈수있음 16년식이상을…"},
 "컨트리맨":{n:"컨트리맨",b:"미니",pr:3500,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/03/17/1d684108-30c6-4d2a-b48a-da4c56995a5d.jpeg",r:"동급대비 작은차체에서 뿜어져나오는 파워와 반응속도, 드라이빙안전성이 여태껏 타봤던 차중 단연 최고였어요 하차감까지 넉넉하게만들어주는 디자인까지 진짜 저에게는 완벽에 가까운 차량이었습니다.",c:"미니의 제 맛을 모르시는분들이 아직많아 수요가 많지않다보니 중고차 가격방어가 어려워요"},
 "A4":{n:"A4",b:"아우디",pr:3600,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/04/22/b8f07812-1668-4011-a803-f2b7edd0dd93.jpeg",r:"그 시절 동급 차량들보다 앞서간 디자인으로 세월이 지나도 촌스럽지 않은 느낌이 장점인것 같습니다. 또 사계절이 뚜렸한 한국에서 겨울철에 눈길에 다른 차들이 꼼짝 못할때 그나마 외제차중 저가로 사륜을 체험해볼 수 있는 점이나, 풀옵션 차량이긴 하지만 차체크기에 비해 출력도 210마력으로 다이나믹한 주행이 가능해서 좋았습니다. 연비도 급가속만 안하면 굉장히 잘 나왔어요.",c:"단점은 아무래도 엔진 특성상 주기적으로 엔진오일을 보충해줘야 한다는 점과, 운전석과 조수석은 키 190이 타도 편할정도지만 뒷자석이 너무 좁아요. 4인 차량으로는 부적합 한거 같고, 키 큰 운전자가 혼자 끌고 다니거나 여자친구와 둘이 타기 좋은 차라고 생각됩니다. 그 외 주변에 다른 외제차 타는 사람들에 비해 큰 고장 없이 소모품만 교체해주면서 잘 탄거 같아요."},
 "3시리즈":{n:"3시리즈",b:"BMW",pr:3900,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/04/db8d7565-a26c-4c16-a97f-1f34d023b163.jpeg",r:"생각보다 넓은 뒷자석 , 생각보다 좋은 출력 (180마력) 타사 디젤엔진 비교해 높은 알피엠사용 가능 (5000rpm) 고속주행시 안정감 , 전기차가 안부러운 연비괴물 누가뭐래도 지금의 비엠더블류를 있게만든 BMW의 시그니쳐 모델 3시리즈 출시당시 타사 동급 차량들중 그어떤차량도 비교불가 (벤츠 c클에 비해 넓은실내 운동성 연비등 이길수있는 차가없음 ) 지금봐도 어색하지않은 실내외 디자인 F바디 디자인은 현역이라봐도 무방 n47 b47 둘다 크리티칼한 이슈없.. (n47 타이밍체인, 리콜) (b47 경유유입 커넥터, 리콜) + 이연…",c:"단점이라곤 없는 동급대비 연식대비 가격대비 최고의 가성비차 F30 실내외디자인 나무랄대가 없으나 딱하나 실내 버스핸들. 못봐줌 뭐 동급타사 차량에 비하면 훌륭하지만 이마저도 저렴한가격에 M핸들로 튜닝가능"},
 "모델Y":{n:"모델Y",b:"테슬라",pr:4000,y:2023,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/23/fdf672ee-2eb0-4a84-b78b-51014514055f.jpeg",r:"우선 연료비와 통행료 부담이 많이 없어요. 매일 100km이상 출퇴근하였지만 전력용량도 넉넉해 아파트 내에 완속충전기로 주1~2화 정도 충전하면되고, 운전이 오토파일럿으로 인하여 정말 편안합니다. 서울~부산 장거리도 수퍼차저나 휴게소 급속충전기를 사용하면 문제없어요.",c:"뒷좌석 승차감은 별로에요. 트렁크는 좀 작은편이라 골프백 넣는 것이 불편하나, 뒷좌석 한쪽만 접으면 3개 새트와 세명이 이동하가는 괜찮아요"},
 "C클래스":{n:"C클래스",b:"벤츠",pr:4200,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/01/14/dbf4a455-73e6-48c6-ad18-21d5bbbb217b.jpeg",r:"우선 배기음이 크신걸 좋아하시는 분들이라면 아쉽다 하시겠지만 저는 부담스럽지 않고 딱정닥했어서 너무 좋았어요 외부도 너무 스포티한 맛이 아예 없지 않아 딱 좋았고 내부는 더더욱 운전하면서 제일 많이 보는 곳이라 되게 만족하고 탄거같습니다 비엠이랑은 또 다른 맛이 있는 차였던거 같습니다",c:"약간 부드러움을 추구 하는 분들이라면 정말 버티기 힘들거나 시끄럽다고 할수있을거 같습니다 안에서 도로의 노면의 상태나 소리가 크게 나고 배기음이 뒷자리는 조금더 크게 들려 장거리갈시 뒷자리에 탄 분들은 시끄러워서 편하지는 않은거같아요 또한 기름값도 고급유나 연비가 썩 좋지는 않습니다 그외는 다좋았습니다"},
 "4시리즈":{n:"4시리즈",b:"BMW",pr:4500,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2025/01/24/01874ed5-9244-48af-9edf-182000587dc0.JPEG",r:"생각보다 넓은 실내, 428 컨버터블 타고 있지만 오픈에어링의 감성은 어떤 차가 와도 따라 올 수 없는 감성, 2000cc 250마력 부족하지 않은 출력과 안정성 너무 매력적이고 좋습니다",c:"고급유 권장이라 기름값 생각하시는분들에게는 좀 힘들 수도 있습니다. 시내주행 연비 6,7 고속주행 위주이시면 강추!! 고속주행 연비 15~17정도 나와요, 고장이라고는 BMW 미세누유인데 미세누유도 여태 타봤지만 저는 없었습니다!"},
 "GLB":{n:"GLB",b:"벤츠",pr:4500,y:2022,p:"",r:"장거리운행시 연비 23키로이상이며 네모나게 각진 트렁크 공간으로 생각보다 엄청난 짐을 실을수 있습니다 앤트리급 모델이지만 나온지 얼마 안된 차량이라 사람들이 잘 몰라서 벤츠suv는 비싸다는인식이 커서 하차감이 좋다고 봅니다 7인승도 나오는 모델이라 뒷자석 리클라이닝이 생각보다 편하게 뒤로 젖혀져서 승차감이 나쁘지 않고 무릎공간도 넓고 머리위로도 공간이 높습니다",c:"생각보다 좌우 폭이 좀 좁긴해서 빅사이즈 사람들은 불편할수도 있긴합니다 골프백이 가로로 들어가지않습니다"},
 "ES":{n:"ES",b:"렉서스",pr:4600,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/05/05/d2ebbea3-8fb8-4911-afbb-cbc18f128fed.jpeg",r:"조용하고 연비가 정말 좋습니다. 저의 마지막차로 생각하고 구매 했는데요 구매후 직장에서 승진을 2번이나 하게 된 행운과 복이 함께한 차입니다. 직장에서 차량이 나와서 어쩔수 없이 판매합니다. 제차를 구매하신분도 행운이 따를겁니다.",c:"전혀 없어요 제가 운전 미숙으로 주차장에서 접촉이 전부입니다."},
 "머스탱":{n:"머스탱",b:"포드",pr:4600,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/04/03/1e20d81b-b6eb-4362-a15c-c7d49bc0680d.jpeg",r:"도로에 잘 없는 유니크함과 3700씨씨의 자연흡기 여유로운 출력이 최고입니다. 요즘 차들처럼 최첨단 장비는 없지만 여유롭게 크루징 할때와 크루즈컨트롤을 이용할 슈 있고 엉따까지 겸비되어져 있습니다. 그리고 은은한 순정 엠비언트 라이트 또한 매력을 가지고 있습니다. 그리고 뻥 뚫린 루프글라스도 날씨를 즐기기에 완벽 합니다.",c:"사이드미러가 와이드가 아니라 처음에 차선변경할때 조금 애먹었지만 지금은 완벽히 숙련 되었으면 어뎁티브 크루즈 컨트롤이 아닌 일반 크루즈칸트롤이 조금 아쉽습니다."},
 "X3":{n:"X3",b:"BMW",pr:4800,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/04/29/b3393ce0-c68a-4b83-a3c9-5a6618003541.jpeg",r:"24살 첫차로 가져와 1년이 안 되는 기간 동안 3만키로 넘게 탔습니다. 15만키로에 가져와 지금은 18만키로가 넘었지만, 고장으로 인한 수리비는 없는 걸 느껴보니 bmw b47 엔진과 zf 미션이 탱크라는 소문은 사실인 거 같습니다. 중고로 아반떼 신차보다 저렴한 가격에 사서 제네시스 gv70 이상의 하차감과 성능은 느낄 수 있었습니다. 좋은 연비와 좋은 성능의 차입니다. 한달에 3천키로 가까이 달리면서 타도 주유비 40만원 넘지 않았으며, 동급 국산차인 gv70과 고속도로에서 함께 달려보면 직선에서는 비슷하게 달리지만 코너에서는…",c:"여러가지 전자장비로 무장되다보니 장점도 있겠지만, 간혹 SW 오류도 생깁니다. 뭐 세상에 완벽한거는 없겠죠. 이해하면서 탔습니다."},
 "Q5":{n:"Q5",b:"아우디",pr:4800,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2025/10/30/868cd43e-edb4-4641-9768-da3f14cb4168.jpeg",r:"아우디 콰트로 4륜 차량이 보여주는 묵직한 주행성능과 편안한 승차감이 특장점입니다 파노라마 썬루프가 있어 엄청난 개방감과 함께 2열 냉방도 따로 조절 가능하기때문에 패밀리카로도 손색없습니다.",c:"어플로 조작이 가능한 요즘 차량과는 달리 시동걸어두기 같은 기능이 없어서 아쉽고, 통풍시트가 없어 아쉬웠습니다. 연비는 휘발유 suv 차량 답게 시내주행7km 정도를 보여줍니다. 순정아우디 네비가 매우 불편하여 안드로이드 오토를 사용합니다."},
 "XC60":{n:"XC60",b:"볼보",pr:4900,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/04/02/1b3c328f-c91b-4cec-a20a-c9f798ca8f7d.jpeg",r:"티맵순정내비의 편안함(음성명령가능), 옵션이 따로 없는 각종 안전장비의 충실함, 장거리에도 편한 시트, 귀호강하는 바워스앤윌킨스 오디오, 시간이 지나도 질리지 않고 당당한 디자인.",c:"냉간시동 때, 엔진회전음이 꽤 커요. 도로주행 시 서스펜션이 딱딱해서 부드러운 주행보다는 좀 단단한 주행질감이에요(B6. 20인치 기준)"},
 "랭글러":{n:"랭글러",b:"지프",pr:5000,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/03/31/c862c804-64fd-4f40-b1d2-005c79783652.jpeg",r:"역시 차가 너무 예쁜데, 차주보다 지인들이 더 좋아합니다. 오프로드를 자주 가진 않지만 자그마한 산 등산로를 타고 꼭대기까지 가는데 전혀 무리가 안됩니다. 눈이 많이 오면 미끌어지겠지만 기분은 전혀 두렵지 않습니다.",c:"랭글러 루비콘 기본 장착된 머드터레인 타이어는 아스팔트에서 소음 진동이 너무 크긴 합니다. 교체할 정도만 타고 올터레인으로 교체했는데 일반 suv 와 같은 승차감입니다."},

 "5시리즈":{n:"5시리즈",b:"BMW",pr:5300,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/15/a02d891f-90d1-41f8-8315-046937ed6e11.jpeg",r:"외장:카본블렉.내장:모카시트 관리상태:1인관리.자부함 주기적.셀프광택.자동세차한번도안함.비흡연.고급유만주유 키3개(본키,디스플레이키.카드키)모두있음 모든기능 잘됨, 앱활용도 우수.원격시동(폰과 연계).자율주행.자동주차.후진50m보조주행.드렁크킥모션자동기능.오디오볼륨모션조정기능.네비.최신업그레이드함.정품블랙박스.하이패스. 엔진오일은 정기적as이외에도 자부담으로 5-6천km주기로 교환 bsi 보증 잔여(2025.11월까지)",c:"Bmw530i 너무 좋은차입니다. 단점 전혀 없고요. 비엠 몰기전에는 도로에 비엠차량의급가속 이해가 안되었는데, 직접 운전해보니 이해가 되더군요. 내가 이런차를 못몰아보고 죽을뻔했구나~하는 생각ㅎㅎ"},
 "E클래스":{n:"E클래스",b:"벤츠",pr:5600,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/06/19/acb1f988-7782-4558-9f5c-dbcc3a1a05ad.jpeg",r:"도로에서 주행 시 정말 구름위를 달리는 것처럼 내가 정말 가솔린 차량을 운전하는 것인지 헷갈릴 정도로 좋습니다. 정말 조용해요. 일단 묵직하고 주행 안정감은 정말 최고고 코너링도 훌륭합니다. 캠핑에 눈을 떠 판매 결정되어 사실 슬프긴 합니다. 내 생에 첫 벤츠, 참 훌륭한 브랜드이고 멋진 차 입니다~",c:"잦은 고장은 없었고 단점이라고 한다면 국산 차량 대비 뒷자리 레그룸이 그렇게 넓지 않습니다. 아반테보단 넓지만 소나타보단 작습니다."},
 "RX":{n:"RX",b:"렉서스",pr:6000,y:2023,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/04/02/aaf80b62-c4cc-48ea-bd4c-8edb9f69b358.jpeg",r:"1.정숙성과 디자인.안전성을 두루 갖춘 좋은 차량이었어요. 2.2010년 말 첫번째 주인(보험 몇번)에게서 입양해서 지금까지 운행한 만큼 애착이 많이 가요. 그 이후 지금까지 큰 사고한 번 없었네요. 3.운행을 20년을 생각했는데 적당한 때가 된 것 같아요. 지금도 카페나 정비업체에서 차량 구매하겠다고 하네요. 그래서 헤이딜러서 적당한 가격을 받아보고 싶어서 올려요. 가격이 맞으면 아시는 분들에게 얘기할 계획입니다.",c:"1.점점 연식이 되니 정숙성ㅈ이 떨어지니 쇼바나 차체 마운트를 손보고 싶었는데 다음 분에게. 2.고장난 경우는 없습니다."},
 "XC90":{n:"XC90",b:"볼보",pr:6500,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2025/07/18/778c2d36-b14d-4616-a8eb-6e381ca0319e.jpeg",r:"중형suv 치고는 가속능력이 뛰어나며 특히 고속도로 운전시 안정감이 탁월합니다. 음향스피커도 훌륭합니다.",c:"출고시부터 만 4년 이상을 제 혼자 운전한 차량인데 아쉽지만 경제사정으로 처분합니다. 잔고장 한 건도 없었어요."},
 "GLC":{n:"GLC",b:"벤츠",pr:6600,y:2023,p:"",r:"220d보다 멋진 외관 디자인에 성능과 연비 두마리 토끼를 다 잡은 매력적인 성능이 최고의 매력이죠! 생산량이 많지 않은 희소성도 있어서 저를 다른이들과 구별해주는 아이덴티티 중에 하나였습니다.",c:"불편함이나 고장은 특별히 없었고 벤츠 자체의 고질적인 문제점(9단기어 변속 충격, 브레이크소음, 와이퍼 정숙성 문제 등)은 있고, 서스펜션이 딱딱해서 과속 방지턱에서 조심해야 한다는 점이 단점이었습니다."},
 "718":{n:"718",b:"포르쉐",pr:7000,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/04/03/31cfe80e-28bf-4c46-9cdb-ee4ec017421d.jpeg",r:"오픈카라는 비교 불가능한 장점 1억이라는 다소 합리적인 가격 인근에서 느낄 수 있는 포르쉐의 감성 무엇보다 운전이 편해집니다. 회사차 운전할때와는 비교가 불가능할 정도로 차량들이 양보를 잘해주고 끼어들기를 자제합니다.",c:"생각보다 후열시트가 아예 존재하지 않는다는 것이 크게 다가옵니다. 내부에 수납공간이 다소 부족하다고 느껴질때가 있습니다. 혼자 타고 다닐때는 불편함을 크게 못느꼈지만 여자친구랑 다니면 이게 굉장히 크게 다가옵니다. 또한, 엔진이 좌석 바로 뒤에 있어 그 열기가 상당합니다. 겨울에 히터가 필요 없을 정도예요. 실제로 약 7년간 히터는 몇번 사용 안했습니다."},
 "디스커버리":{n:"디스커버리",b:"랜드로버",pr:7200,y:2021,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2026/03/31/1d745218-53ba-4ead-bb61-cc80ae6d72da.jpeg",r:"디젤차에 비해 생각보다 소음이 거의 없어요 그리고 랜드로버 평판이 안 좋은데 저는 뽑기 잘 한거 같습니다 바로 아는센타 가서 정비했는데 문제 1도 없어요 연비는 차가 커서 별로라고 하기는한데 저는 이건 운전습관에 달려있다고 생각합니다 차는 정말 마음에 드는데 결혼을해서 패밀리카로 타려고 샀는데 니1미 이혼하는 바람에 다시 팔려고 합니다 혼자 타기에는 조금 부담스럽네요.. 아무튼 저는 만족스럽습니다",c:"큰 차를 사고 싶어서 산거지만 정말 많이 큽니다 ㅋㅋㅋ 주차타워 같은곳 들어가기 힘든정도? 문제점은 크게 없었어요 혼자 타기는 좀 그렇고 3인 4인가구 기준 진짜 만족하실거에요"},
 "마칸":{n:"마칸",b:"포르쉐",pr:7900,y:2022,p:"",r:"가장 저렴한 가격에 경험할 수 있는 포르쉐입니다. 4기통이지만 밟는 대로 잘 나가고 스포츠 모드 에서는 더 잘 나갑니다. 무엇보다 하차 감이 좋습니다.",c:"실내 공간이 특히 뒷자석이 조금 좁은 편입니다. 초등학생 아이 둘을 데리고 타기에 좋지는 않은데, 중고등학생 아이들이 있다면 뒷자석에 타기에 좁을 것 같습니다."},

 "X5":{n:"X5",b:"BMW",pr:8600,y:2022,p:"https://image.heydealer.com/unsafe/2200x0/https://prnd-car-purchase.s3.ap-northeast-2.amazonaws.com/media/cars/carmediafile/2025/01/03/6e7bb47b-08a5-4cab-a84d-b97b14656197.JPEG",r:"준대형 suv이지만 스포츠성이 좋아 코너링 및 가속 성능이 좋습니다. 아울러 큰폭의 타이어를 장착하고 6기통 3000cc의 디젤엔진의 연비가 시내주행시 10km/l 이상은 꾸준히 나오고 장거리 항속주행시 연비가 상상 이상으로 좋습니다.",c:"1만키로도 안된 새차라 큰 불편함이나 단점은 모르겠고 타면서 타이어가 커서 나중에 교체를 어찌하나 걱정되는 정도"},

function mcard(m,bad){var c=CARDB[m];if(!c)return '';
 var price='<span style="color:#0F6E56;font-weight:600;font-size:12px">'+c.pr.toLocaleString()+'만원~</span>';
 var txt=bad?(c.c||''):(c.r||''),col=bad?'#9c6b5e':'#5F5E5A';
 var body='<div style="margin-top:1px">'+price+'</div>';
 if(txt){var LIM=68;
  if(txt.length>LIM){var sh=txt.slice(0,LIM).replace(/\s+$/,'');
   body+='<div style="font-size:12px;color:'+col+';line-height:1.45;margin-top:3px"><span class="rShort">"'+sh+'… </span><span class="rFull" style="display:none">"'+txt+'" </span><span class="rMore" onclick="expandRvw(this)" style="color:#D6347E;font-weight:700;cursor:pointer;white-space:nowrap">더보기</span></div>';}
  else{body+='<div style="font-size:12px;color:'+col+';line-height:1.45;margin-top:3px">"'+txt+'"</div>';}}
 else if(bad){body+='<div style="font-size:11px;color:#b9b7b0;margin-top:2px">· 나랑은 좀…</div>';}
 return '<div class="lcard'+(bad?'':' rec')+'"'+(bad?' style="opacity:.92"':'')+'><img class="thumb" src="'+(c.p||CARSAMPLES[0])+'" loading="lazy" onerror="this.onerror=null;this.src=CARSAMPLES[0]" alt="'+c.n+'"><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">'+c.n+' <span style="color:#b9b7b0;font-weight:400;font-size:11px">'+c.b+'</span></div>'+body+'</div></div>';
}
function expandRvw(el){var w=el.parentNode;var s=w.querySelector('.rShort'),f=w.querySelector('.rFull');if(s)s.style.display='none';if(f)f.style.display='inline';el.style.display='none';}
function initMore(root){(root||document).querySelectorAll('.rvw').forEach(function(el){var b=el.nextElementSibling;if(!b||!b.classList.contains('moreBtn'))return;if(el.classList.contains('open')){b.style.display='none';return;}var lh=parseFloat(getComputedStyle(el).lineHeight)||18;el.style.display='block';el.style.webkitLineClamp='unset';var full=el.scrollHeight;el.style.display='';el.style.webkitLineClamp='';var longTxt=(el.textContent||'').replace(/\s+/g,'').length>55;b.style.display=(full>lh*3+2||longTxt)?'inline-block':'none';});}
function scheduleMore(root){initMore(root);try{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){initMore(root);});}catch(e){}setTimeout(function(){initMore(root);},400);}
function budgetBox(){var d=(REC[CUR]||{})[CUR_B]||{rec:[],anti:[]};
 return '<div style="display:flex;gap:5px;margin:6px 0 12px">'+BANDS.map(function(x){return '<button onclick="setBudget('+x[0]+')" style="flex:1;min-width:0;padding:8px 2px;border:2px solid '+(x[0]===CUR_B?'#5FA218':'#F0D0E2')+';background:'+(x[0]===CUR_B?'#C7EE7E':'#fff')+';color:'+(x[0]===CUR_B?'#34600d':'#a584a5')+';font-size:13px;font-weight:700;cursor:pointer;font-family:var(--jua);border-radius:0;box-shadow:'+(x[0]===CUR_B?'1px 1px 2px rgba(52,99,13,.30)':'2px 2px 3px rgba(120,50,90,.22)')+'">'+x[1]+'</button>';}).join('')+'</div>'
 +'<div class="sec">💚 나랑 잘 맞는 추천 모델</div>'+(d.rec.map(function(m){return mcard(m,false);}).join('')||'<p class="sub" style="font-size:12px">이 예산대 추천 준비 중</p>')
 +(d.anti.length?'<div class="sec">🙅 이건 좀 비추천</div>'+d.anti.map(function(m){return mcard(m,true);}).join(''):'');
}
function setBudget(b){CUR_B=b;track('budget',{band:b,code:CUR});var el=document.getElementById('carfit');if(el){el.innerHTML=budgetBox();scheduleMore(el);}}
const DESC={
 FVSM:"국민 가장은 나보다 식구가 먼저다. 튀는 걸 바라지 않고, 모두가 편한 무난함을 택한다. 큰 욕심 없이 안정적인 게 제일이라 믿는다. 검증된 길, 많이들 가는 길이 결국 옳다고 생각한다. 차도 사람도 '믿을 만한가'를 먼저 본다. 장점은 어떤 상황에서도 흔들리지 않는 든든함이다. 단점은 가끔 자기 자신을 뒤로 미룬다는 것. 화려함은 없어도 곁에 있으면 안심되는 사람이다. 요란한 약속보다 매일의 책임으로 증명한다. 평범함이 사실 제일 어렵다는 걸, 이 사람은 안다.",
 FVSR:"숨은 대형 헌터는 남들이 모르는 가치를 알아본다. 비싸지 않아도 크고 든든한 것에서 만족을 찾는다. 유행을 좇지 않고, 자기만의 기준으로 고른다. 가족을 다 태우고도 남는 공간에 마음이 놓인다. 남들이 '그걸 왜?' 해도 흔들리지 않는다. 장점은 실속과 안목을 동시에 갖췄다는 것. 단점은 그 진가를 알아주는 사람이 적어 외로울 때가 있다는 것. 검증된 큰 차 한 대에 오래 정 붙이는 사람이다. 요란하지 않게, 그러나 확실하게 자기 세계를 챙긴다. 알아주는 이 없어도, 본인은 이미 만족한다.",
 FVNM:"실속 얼리어답터는 새것에 끌리면서도 지갑은 챙긴다. 신상 정보는 누구보다 빠삭하지만, 결정은 신중하다. 옵션표를 밤새 비교하고, 가성비의 최적점을 찾는다. 가족이 편하게 쓸 수 있는지를 늘 먼저 따진다. 충동을 이성으로 누르는 데 익숙하다. 장점은 트렌드와 실용을 동시에 잡는 균형 감각. 단점은 너무 재다가 타이밍을 놓치기도 한다는 것. 결국 가장 무난하고 똑똑한 선택에 안착한다. 화려한 신문물보다 똑부러진 실속을 택하는 사람. 그 선택엔 늘 이유가 있다.",
 FVNR:"가성비 개척자는 남들보다 한발 먼저 새 길을 간다. 전기차든 신생 브랜드든, 검증보다 가능성을 본다. 다만 비싼 건 못 참는다 — 신문물도 가성비여야 한다. 모험심은 있지만 지갑은 철저히 현실적이다. 장점은 변화를 두려워하지 않는 개척 정신. 단점은 앞서가다 보니 알아주는 동료가 적다는 것. 남들이 망설일 때 먼저 손드는 용기가 있다. 실용과 새로움 사이에서 자기만의 답을 찾는다. 비주류라도 똑똑한 선택이면 당당하다. 결국 시대가 그를 따라오는 경우가 많다.",
 FBSM:"검증된 회장님은 격(格)을 안다. 무리하지 않되, 급은 절대 양보하지 않는다. 검증된 프리미엄만이 마음을 놓이게 한다. 가족 앞에서 어깨가 펴지는 차, 그게 자존심이다. 새것보다 믿을 만한 명품을 택한다. 장점은 안정감과 품위를 함께 갖췄다는 것. 단점은 남의 시선을 은근히 의식한다는 것. 주차장에서 가장 당당한 사람이 바로 이 사람이다. 요란한 신상 대신 검증된 클래스를 두른다. 보여주기 위해서가 아니라, 스스로 떳떳하기 위해서다.",
 FBSR:"정통 대장은 로망을 현실로 끌고 온다. 흔한 프리미엄은 시시하고, 검증된 희귀템에 끌린다. SUV 한 대에 캠핑과 오프로드의 꿈을 싣는다. 남들 다 타는 건 재미없다고 생각한다. 장점은 묵직한 취향과 흔들리지 않는 신념. 단점은 유지비도 로망값이라며 합리화한다는 것. 거친 길도 두렵지 않은 든든함이 있다. 가족을 지키는 단단한 요새 같은 차를 원한다. 검증됐으면서 희소한, 그 둘 다를 포기 못 한다. 겉은 투박해도 속엔 낭만이 가득하다.",
 FBNM:"프리미엄 트렌드세터는 최신과 최고를 동시에 원한다. 신상 패밀리카는 다 그의 레이더 안에 있다. 가족도, 자기 자신도 좋은 걸 누려야 한다고 믿는다. 할부를 안고서라도 트렌드의 맨 앞에 선다. 장점은 시대의 흐름을 빠르게 읽는 감각. 단점은 욕심이 지갑보다 한발 앞선다는 것. 남들이 따라 사기 시작하면 이미 다음을 본다. 좋은 건 함께 누리자는 통 큰 마음이 있다. 패밀리카에도 멋과 신문물을 포기하지 않는다. 그에게 평범은 선택지에 없다.",
 FBNR:"장비병 끝판왕은 필요보다 로망으로 산다. 가족용이라 우기지만, 사실 본인이 제일 신났다. 루프탑 텐트, 드론, 최신 옵션까지 다 갖춰야 직성이 풀린다. 희귀하고 새롭고 비싼 것에 약하다. 장점은 무엇이든 끝까지 파고드는 열정. 단점은 그 열정이 종종 통장을 비운다는 것. 남들 안 가진 걸 가졌을 때 가장 행복하다. 가족이라는 명분과 자기 취향이 절묘하게 겹친다. 장비가 늘수록 삶이 풍요롭다 믿는 사람. 끝판왕이라는 말이 아깝지 않다.",

 DVSR:"추억의 낭만러는 효율보다 감성에 투자한다. 남들 안 타는 올드카와 머슬카의 낭만을 안다. 비싸진 않아도 가슴 뛰는 소리에 지갑을 연다. 우렁찬 배기음 하나면 하루가 행복하다. 장점은 자기만의 취향을 끝까지 지키는 뚝심. 단점은 감성에 쓴 돈만큼 정비소에도 쓴다는 것. 남들의 '왜 그런 차를'이라는 말엔 미소만 짓는다. 추억과 낭만을 굴러가게 만드는 사람이다. 신상보다 사연 있는 차에 마음이 간다. 손해 보는 듯해도, 마음은 늘 부자다.",
